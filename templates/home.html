<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Тренажёр по операционным системам</title>
</head>
<body>
    <main>
        <h1>Тренажёр по операционным системам</h1>
        {% if topics %}
            <ul>
                {% for topic in topics %}
                    <li>
                        <a href="{% url 'topic-detail' slug=topic.slug %}">{{ topic.name }}</a>
                        — вопросов: {{ topic.question_count }}
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>Темы пока не добавлены</p>
        {% endif %}
    </main>
</body>
</html>
