services:
  web:
    build: .
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Скопируйте .env.example в .env}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      POSTGRES_DB: "${POSTGRES_DB:?Укажите POSTGRES_DB в .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Укажите POSTGRES_USER в .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в .env}"
      POSTGRES_HOST: db
      VALKEY_URL: redis://valkey:6379/0
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Укажите POSTGRES_DB в .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Укажите POSTGRES_USER в .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в .env}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
